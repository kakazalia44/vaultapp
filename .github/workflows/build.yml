name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Не задан секрет KEYSTORE_B64 (ключ подписи). Без него версии нельзя ставить друг поверх друга."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Build signed release APK
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle assembleRelease --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "vault-$VERSION.apk"
          gh release create "v$VERSION" "vault-$VERSION.apk" \
            --title "Версия $VERSION" \
            --notes "Сборка №${{ github.run_number }}" \
            --target "${{ github.sha }}"
